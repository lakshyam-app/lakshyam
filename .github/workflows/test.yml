name: Tests
# Runs the automatic checks (pure logic only: no browser, no real data) on every push.
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.mjs
      - name: Docs are up to date
        run: |
          node tools/gen-docs.mjs
          git diff --exit-code -- docs/
